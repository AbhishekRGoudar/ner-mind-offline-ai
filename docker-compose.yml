services:
  # 1. Production PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ner_mind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ner_mind}
      POSTGRES_USER: ${POSTGRES_USER:-ner_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ner_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ner_admin} -d ${POSTGRES_DB:-ner_mind}"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

  # 2. Node/Express Backend API
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: ner_mind_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ner_admin}:${POSTGRES_PASSWORD:-ner_secure_password_2026}@postgres:5432/${POSTGRES_DB:-ner_mind}?sslmode=disable
      CORS_ORIGIN: "http://localhost,http://localhost:3000,http://localhost:80,http://frontend"
      SESSION_SECRET: ${SESSION_SECRET:-ner_mind_session_secret_change_in_production}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 10s

  # 3. NGINX PWA Frontend Web Server
  frontend:
    build:
      context: .
      dockerfile: packages/patient-app/Dockerfile
    container_name: ner_mind_frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 5s

volumes:
  pgdata:
    name: ner_mind_pgdata
